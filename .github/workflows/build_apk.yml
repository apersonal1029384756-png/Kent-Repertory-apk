name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 1. Generates the missing android/ folder structure
      - name: Generate Android Scaffold
        run: flutter create . --platforms=android --org com.marshall.kentrepertory

      # 2. Set the App Display Name (under the icon)
      - name: Rename App Label
        run: |
          sed -i 's/android:label=".*"/android:label="Kent Repertory"/' android/app/src/main/AndroidManifest.xml

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      # 3. Rename the output APK file before uploading
      - name: Rename APK Output
        run: |
          mkdir -p final_apk
          cp build/app/outputs/flutter-apk/app-release.apk final_apk/Kent_Repertory.apk

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: Kent-Repertory-APK
          path: final_apk/Kent_Repertory.apk
